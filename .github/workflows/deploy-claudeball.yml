name: Replace baseball with Claudeball 3D
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-claudeball.yml'
permissions:
  contents: write
concurrency:
  group: claudeball-deploy
  cancel-in-progress: false
jobs:
  build-and-replace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout homepage
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout Claudeball source and original assets
        uses: actions/checkout@v4
        with:
          repository: TaylorBeeston/claudeball
          ref: 424b1b512fd34a28d5078c9f644988b64e67b4ec
          path: .claudeball-source
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .claudeball-source/package-lock.json
      - name: Validate original assets
        run: |
          test -s .claudeball-source/assets/shipped.json
          test -s .claudeball-source/assets/field_layout.json
          test -d .claudeball-source/assets/optimized
      - name: Install, typecheck, test and build
        working-directory: .claudeball-source
        env:
          CB_BASE: /baseball/
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          test -s dist/index.html
          test -d dist/assets/optimized
          grep -q '/baseball/' dist/index.html
      - name: Replace only existing baseball directory
        run: |
          rm -rf baseball
          mkdir baseball
          cp -a .claudeball-source/dist/. baseball/
          touch baseball/.nojekyll
          test -s baseball/index.html
      - name: Commit built game to homepage master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- baseball
          if git diff --cached --quiet; then
            echo 'Claudeball build already deployed'
            exit 0
          fi
          git commit -m 'Replace NEO BASEBALL with built Claudeball 3D game'
          git push origin HEAD:master
      - name: Summary
        run: |
          echo 'Claudeball build committed to master at /baseball/.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verify GitHub Pages publishing and browser gameplay at https://eentost.github.io/baseball/' >> "$GITHUB_STEP_SUMMARY"
