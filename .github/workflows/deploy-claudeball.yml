name: Publish Claudeball only after manual-play gate
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-claudeball.yml'
      - 'scripts/prepare_claudeball_seo.py'
permissions:
  contents: write
concurrency:
  group: claudeball-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout homepage
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Checkout pinned Claudeball source with history
        uses: actions/checkout@v5
        with:
          repository: TaylorBeeston/claudeball
          ref: 424b1b512fd34a28d5078c9f644988b64e67b4ec
          fetch-depth: 0
          path: .claudeball
          persist-credentials: false
      - name: Restore original 3D assets from upstream Git history
        working-directory: .claudeball
        shell: bash
        run: |
          set -euo pipefail
          ASSET_COMMIT=66ca30dfcf3af2e56d517a38a61e2d2814a2830a
          git cat-file -e "$ASSET_COMMIT^{commit}"
          git checkout "$ASSET_COMMIT" -- assets/field_layout.json assets/players/player_manifest.json assets/optimized
          test -s assets/field_layout.json
          test -s assets/players/player_manifest.json
          test -s assets/optimized/players/player_base.glb
          test -s assets/optimized/players/player_ballkid.glb
          test -s assets/optimized/players/player_coach.glb
          test -s assets/optimized/players/player_umpire.glb
          test -s assets/optimized/players/player_umpire_base.glb
          echo "Restored asset files from upstream commit $ASSET_COMMIT"
          du -sh assets
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .claudeball/package-lock.json
      - name: Install dependencies
        working-directory: .claudeball
        run: npm ci
      - name: TypeScript check
        working-directory: .claudeball
        run: npm run typecheck
      - name: Unit tests including deferred decision-provider contract
        working-directory: .claudeball
        run: npm test
      - name: Build browser game for homepage subpath
        working-directory: .claudeball
        env:
          CB_BASE: /baseball/
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/assets/field_layout.json
          test -s dist/assets/optimized/players/player_base.glb
          grep -q '/baseball/' dist/index.html
          python3 ../scripts/prepare_claudeball_seo.py "$PWD/dist/index.html"
      - name: Gate manual controls before publishing
        working-directory: .claudeball
        run: |
          set -euo pipefail
          test -s src/ui/human.ts
          grep -q "control: 'both'" src/ui/settings.ts
          grep -q "mode: PlayAs = 'both'" src/ui/human.ts
          grep -q "HumanControl" src/ui/app.ts
          grep -q "humanSwing" src/sim/game.ts
          echo 'Verified human control source and default mode.'
      - name: Replace only /baseball with verified production build
        run: |
          set -euo pipefail
          rm -rf baseball
          mkdir -p baseball
          cp -a .claudeball/dist/. baseball/
          touch baseball/.nojekyll
          test -s baseball/index.html
          test -s baseball/assets/field_layout.json
          test -s baseball/assets/optimized/players/player_base.glb
      - name: Validate repository SEO metadata and sitemap inputs
        run: python3 scripts/seo_sitemap.py --validate
      - name: Commit replacement to homepage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+eentost@users.noreply.github.com'
          # The SEO workflow may commit sitemap.xml while this build runs.
          # Refresh the branch before staging the generated game so only baseball/ is changed.
          git fetch origin master
          git reset --mixed origin/master
          git add -A -- baseball
          if git diff --cached --quiet; then
            echo 'No generated baseball files changed; deployment commit skipped.'
          else
            git commit -m 'Publish Claudeball 3D baseball simulation'
            # Retry only non-fast-forward races; never force-push or overwrite other paths.
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:master; then break; fi
              if [ "$attempt" -eq 5 ]; then echo 'ERROR: unable to push after five attempts' >&2; exit 1; fi
              git fetch origin master
              git rebase origin/master
            done
          fi
      - name: Publish summary
        run: |
          {
            echo '## Claudeball 3D simulation deployment'
            echo '- 3D assets restored from pinned upstream Git history and checked for required files'
            echo '- TypeScript check and the full unit-test suite passed'
            echo '- Deferred decision-provider contract is covered by upstream simulation tests'
            echo '- Production build uses the /baseball/ base path'
            echo '- SEO canonical, Open Graph, Twitter Card and VideoGame JSON-LD metadata were injected and validated'
            echo '- Replaced only the baseball/ directory'
            echo '- URL: https://eentost.github.io/baseball/'
            echo ''
            echo 'Scope note: the pinned upstream source is an AI-vs-AI simulation. The decision-provider API is tested, but browser-level human controls and online multiplayer are not implemented or certified by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
