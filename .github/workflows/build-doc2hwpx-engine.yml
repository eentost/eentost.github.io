name: Build doc2hwpx IeumOffice engine

on:
  push:
    branches: [master]
    paths:
      - "tools/doc2hwpx.html"
      - "tools/doc2hwpx-engine/**"
      - ".github/workflows/build-doc2hwpx-engine.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doc2hwpx-ieumoffice-engine
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout pinned IeumOffice source
        uses: actions/checkout@v4
        with:
          repository: pblsketch/ieumoffice
          ref: 18cfc7150a2028487a2ae669a324d02bae93570a
          path: ieumoffice
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ieumoffice/package-lock.json

      - name: Install upstream workspace dependencies
        working-directory: ieumoffice
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build browser worker bundle
        run: npx --yes vite@7.3.1 build --config tools/doc2hwpx-engine/vite.config.mjs

      - name: Copy and compress upstream WebAssembly engine
        run: |
          test -s ieumoffice/vendor/rhwp-core/rhwp_bg.wasm
          gzip -9 -c ieumoffice/vendor/rhwp-core/rhwp_bg.wasm > tools/doc2hwpx-assets/rhwp_bg.wasm.gz
          test -s tools/doc2hwpx-assets/rhwp_bg.wasm.gz

      - name: Smoke test real HWP to HWPX conversion
        run: |
          mkdir -p /tmp/doc2hwpx-qa
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import initRhwp, { HwpDocument } from './ieumoffice/vendor/rhwp-core/rhwp.js';

          const wasm = new Uint8Array(await readFile('ieumoffice/vendor/rhwp-core/rhwp_bg.wasm'));
          await initRhwp({ module_or_path: wasm });
          const source = new Uint8Array(await readFile('ieumoffice/apps/hwp/tests/fixtures/memo.hwp'));
          const doc = new HwpDocument(source);
          let exported;
          let result;
          try {
            exported = doc.exportHwpxWithReport();
            const lossReport = exported.contentLoss();
            result = exported.takeBytes();
            assert.ok(result.length > 1000, 'HWPX output is unexpectedly small');
            const reopened = new HwpDocument(result);
            let pages;
            try {
              pages = reopened.pageCount();
              assert.ok(Number.isInteger(pages) && pages > 0, 'reopened HWPX has no pages');
            } finally {
              reopened.free();
            }
            await writeFile('/tmp/doc2hwpx-qa/upstream-smoke.hwpx', result);
            await writeFile('/tmp/doc2hwpx-qa/report.json', JSON.stringify({
              input: 'memo.hwp',
              inputBytes: source.length,
              output: 'upstream-smoke.hwpx',
              outputBytes: result.length,
              pages,
              lossReport,
              reopened: true
            }, null, 2));
            console.log(JSON.stringify({ inputBytes: source.length, outputBytes: result.length, pages, lossReport, reopened: true }));
          } finally {
            exported?.free();
            doc.free();
          }
          await writeFile('/tmp/doc2hwpx-qa/rhwp.js', await readFile('ieumoffice/vendor/rhwp-core/rhwp.js'));
          await writeFile('/tmp/doc2hwpx-qa/rhwp_bg.wasm', wasm);
          NODE

      - name: Smoke test native HWP viewer page rendering
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import initRhwp, { HwpDocument, HwpViewer } from './ieumoffice/vendor/rhwp-core/rhwp.js';
          const wasm = new Uint8Array(await readFile('ieumoffice/vendor/rhwp-core/rhwp_bg.wasm'));
          await initRhwp({ module_or_path: wasm });
          const source = new Uint8Array(await readFile('ieumoffice/apps/hwp/tests/fixtures/memo.hwp'));
          const doc = new HwpDocument(source);
          const viewer = new HwpViewer(doc);
          try {
            const pages = viewer.pageCount();
            assert.ok(pages > 0, 'viewer page count should be positive');
            const svg = viewer.renderPageSvg(0);
            assert.ok(typeof svg === 'string' && svg.includes('<svg'), 'first page should render to SVG');
            assert.ok(svg.includes('viewBox') || svg.includes('width'), 'rendered SVG should include page geometry');
            console.log(JSON.stringify({ fixture: 'memo.hwp', pages, firstPageSvgBytes: new TextEncoder().encode(svg).length, rendered: true }));
          } finally {
            viewer.free();
            doc.free();
          }
          NODE

      - name: Preserve upstream license and attribution notices
        run: |
          mkdir -p tools/doc2hwpx-assets/licenses
          cp ieumoffice/LICENSE tools/doc2hwpx-assets/licenses/IEUMOFFICE-LICENSE-APACHE-2.0.txt
          cp ieumoffice/NOTICE tools/doc2hwpx-assets/licenses/IEUMOFFICE-NOTICE.txt
          cp ieumoffice/LICENSE-UNICODE.txt tools/doc2hwpx-assets/licenses/LICENSE-UNICODE.txt
          cp ieumoffice/vendor/rhwp-core/LICENSE tools/doc2hwpx-assets/licenses/RHWP-LICENSE-MIT.txt
          cp ieumoffice/vendor/rhwp-core/THIRD_PARTY_LICENSES.md tools/doc2hwpx-assets/licenses/RHWP-THIRD-PARTY-LICENSES.md
          cat > tools/doc2hwpx-assets/licenses/README.md <<'EOF'
          # doc2hwpx bundled engine licenses

          The DOCX-to-HWPX browser bundle includes code from IeumOffice/GenOffice and the rhwp WebAssembly engine.

          - IEUMOFFICE-LICENSE-APACHE-2.0.txt: upstream Apache License 2.0.
          - IEUMOFFICE-NOTICE.txt: upstream copyright, attribution, and third-party notices.
          - RHWP-LICENSE-MIT.txt: rhwp MIT license.
          - RHWP-THIRD-PARTY-LICENSES.md: third-party components and license inventory for the rhwp engine.
          - LICENSE-UNICODE.txt: Unicode License v3 notice for Unicode data used by the upstream work.

          Upstream source revision: 18cfc7150a2028487a2ae669a324d02bae93570a.
          The browser adapter and page integration are original eentost modifications. The upstream source files are not modified.
          EOF
          cat > tools/doc2hwpx-assets/SOURCE.txt <<'EOF'
          Upstream: https://github.com/pblsketch/ieumoffice
          Revision: 18cfc7150a2028487a2ae669a324d02bae93570a
          Packages: @genoffice/docx2hwp, @genoffice/docx-engine, @rhwp/core
          Output: browser bundle + gzip-compressed rhwp WebAssembly
          License files: tools/doc2hwpx-assets/licenses/
          EOF

      - name: Generate JavaScript dependency license inventory
        working-directory: ieumoffice
        run: |
          npx --yes license-checker --production --json --includeLicenseText --start ./packages/docx2hwp --out ../tools/doc2hwpx-assets/licenses/NPM-THIRD-PARTY-NOTICES.json

      - name: Validate generated assets
        run: |
          test -s tools/doc2hwpx-assets/doc2hwpx-engine.js
          test -s tools/doc2hwpx-assets/rhwp_bg.wasm.gz
          test -s tools/doc2hwpx-assets/licenses/IEUMOFFICE-LICENSE-APACHE-2.0.txt
          test -s tools/doc2hwpx-assets/licenses/RHWP-LICENSE-MIT.txt
          node --check tools/doc2hwpx-assets/doc2hwpx-engine.js
          gzip -t tools/doc2hwpx-assets/rhwp_bg.wasm.gz
          du -h tools/doc2hwpx-assets/doc2hwpx-engine.js tools/doc2hwpx-assets/rhwp_bg.wasm.gz

      - name: Upload browser conversion QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc2hwpx-engine-qa
          path: /tmp/doc2hwpx-qa/
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated engine assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/doc2hwpx-assets
          if git diff --cached --quiet; then
            echo "Generated engine assets are already current."
            exit 0
          fi
          git commit -m "Build doc2hwpx IeumOffice browser engine [skip ci]"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
