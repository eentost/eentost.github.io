# Site Settings
locale                   : "ko-KR"
title                    : "EENTOST"
subtitle                 : "AI Cybersecurity Research Notes"
name                     : "EENTOST"
description              : "AI 기반 사이버보안, 악성코드 분석, 웹·클라우드 보안을 실무 관점에서 설명하는 독립 기술 블로그입니다."
url                      : "https://eentost.github.io"
teaser                   :
logo                     : "/assets/images/eentost-mark.svg"
masthead_title           : "EENTOST"
breadcrumbs              : true
words_per_minute         : 200

# Author
author :
  name                   : "EENTOST"
  avatar                 :
  bio                    : "AI 기반 사이버보안, 악성코드 분석, 침해 탐지 기술을 연구하고 기록합니다."
  location               : "Seoul, South Korea"
  email                  :
  uri                    : https://eentost.github.io
  github                 : eentost
  twitter                : eentost

# Analytics
analytics :
  provider               : false
google_site_verification :
bing_site_verification   :

# SEO
seo :
  type                   : Person
  name                   : EENTOST
  twitter :
    username             : eentost
  og_locale              : ko_KR

# Publishing
timezone                 : Asia/Seoul
search                   : true
search_full_content      : true
minimal_mistakes_skin    : default

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      share: true
      related: true
      toc: true
      toc_sticky: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

# Reading Files
include :
  - .htaccess
  - _pages
  - files
exclude :
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files :
  - .git
  - .svn
encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown                 : kramdown
highlighter              : rouge
lsi                      : false
excerpt_separator        : "\n\n"
incremental              : false

# kramdown
kramdown :
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  footnote_nr            : 1
  entity_output          : as_char
  toc_levels             : 1..6
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
  enable_coderay         : false
