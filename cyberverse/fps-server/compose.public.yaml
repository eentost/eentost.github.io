services:
  fps:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      ALLOWED_ORIGINS: https://eentost.github.io
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - fps
    environment:
      FPS_DOMAIN: ${FPS_DOMAIN:?Set FPS_DOMAIN in .env}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
